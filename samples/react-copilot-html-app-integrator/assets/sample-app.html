<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team Announcement Board</title>
<style>
  body{margin:0;background:#f6f8fb;padding:24px;box-sizing:border-box;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:#1f2937}
  .head{background:linear-gradient(180deg,#eef6ff 0,#f6f8fb 100%);border:1px solid #e5e7eb;border-radius:16px;padding:20px;margin-bottom:16px}
  .head h1{margin:0;font-size:26px}
  .head p{margin:6px 0 0;color:#6b7280}
  .add-row{display:flex;gap:10px;margin-bottom:16px}
  .add-row input{flex:1;border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px;font-size:14px}
  .add-row button{border:0;background:#0078d4;color:#fff;border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer}
  .add-row button:hover{background:#106ebe}
  .board{display:grid;gap:12px}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px 16px;box-shadow:0 6px 16px rgba(17,24,39,.06);display:flex;justify-content:space-between;align-items:center;gap:12px}
  .card p{margin:0;font-size:14px}
  .card time{display:block;margin-top:2px;font-size:12px;color:#6b7280}
  .card button{border:0;background:transparent;color:#a80000;cursor:pointer;font-size:13px}
  .empty{text-align:center;color:#6b7280;padding:30px;font-size:14px}
</style>
</head>
<body>
  <div class="head">
    <h1>Team Announcement Board</h1>
    <p>A minimal, self-contained sample app for reviewer testing &mdash; no SharePoint list required.</p>
  </div>

  <div class="add-row">
    <input id="msgInput" type="text" placeholder="Type an announcement and press Add&hellip;">
    <button id="addBtn" type="button">Add</button>
  </div>

  <div class="board" id="board"></div>
  <div class="empty" id="emptyState" style="display:none">No announcements yet &mdash; add one above.</div>

  <script>
    (function () {
      var seed = [
        { text: 'Welcome to the Team Announcement Board sample app!', time: 'Just now' },
        { text: 'This app runs entirely inside the sandboxed iframe — no network calls, no SharePoint data required.', time: 'Just now' }
      ];

      var board = document.getElementById('board');
      var emptyState = document.getElementById('emptyState');
      var input = document.getElementById('msgInput');
      var addBtn = document.getElementById('addBtn');

      function render() {
        board.innerHTML = '';
        emptyState.style.display = seed.length ? 'none' : 'block';

        seed.forEach(function (item, index) {
          var card = document.createElement('div');
          card.className = 'card';

          var textWrap = document.createElement('div');
          var p = document.createElement('p');
          p.textContent = item.text;
          var time = document.createElement('time');
          time.textContent = item.time;
          textWrap.appendChild(p);
          textWrap.appendChild(time);

          var removeBtn = document.createElement('button');
          removeBtn.type = 'button';
          removeBtn.textContent = 'Remove';
          removeBtn.addEventListener('click', function () {
            seed.splice(index, 1);
            render();
          });

          card.appendChild(textWrap);
          card.appendChild(removeBtn);
          board.appendChild(card);
        });
      }

      function addAnnouncement() {
        var value = input.value.trim();
        if (!value) {
          return;
        }
        seed.unshift({ text: value, time: new Date().toLocaleTimeString() });
        input.value = '';
        render();
      }

      addBtn.addEventListener('click', addAnnouncement);
      input.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') {
          addAnnouncement();
        }
      });

      render();
    })();
  </script>
</body>
</html>
